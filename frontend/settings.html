<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Sterownik kotła – Ustawienia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles-settings.css" />
        <link rel="icon" href="icon.svg" type="image/svg+xml" />
      <link rel="apple-touch-icon" href="icon-180.png" />
      <link rel="manifest" href="manifest.json" />
      <meta name="theme-color" content="#1f2937" />
</head>
  <body>
      <input id="nav-toggle" class="nav-toggle" type="checkbox" />
      <div class="app">
      <label for="nav-toggle" class="burger-btn" aria-label="Menu">☰</label>
      <main class="layout">
        <!-- LEWA / CENTRALNA CZĘŚĆ: USTAWIENIA W STYLU DIAGRAMU -->
        <section class="diagram-wrapper">
          <div class="diagram placeholder settings-container">
            <div class="settings-inner">
              <header class="main-header">
                <h1>Ustawienia</h1>
                <p class="main-subtitle">
                  Wybierz moduł i zmień parametry przyciskami. Bez wpisywania z klawiatury.
                </p>
              </header>

              <div id="config-root" class="config-root">
                <div id="config-tabs-header" class="config-tabs-header">
                  <!-- tu JS wstawi taby z modułami -->
                </div>
                <div id="config-tabs-body" class="config-tabs-body">
                  <!-- tu JS wstawi panele dla modułów -->
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- PRAWA KOLUMNA: MENU (TAKA SAMA JAK NA index.html) -->
        <aside class="side-menu">
          <div class="side-clock">
            <div id="side-clock-time" class="side-clock-time">--:--</div>
          </div>

          <div class="menu-grid">
            <a class="menu-btn" data-view="panel" href="index.html">
              <span class="menu-icon">🏠</span>
              <span class="menu-label">PANEL 1</span>
            </a>

            <a class="menu-btn" data-view="manual" href="manual.html">
              <span class="menu-icon">🛠️</span>
              <span class="menu-label">TRYB RĘCZNY</span>
            </a>

            <a class="menu-btn" data-view="ignite" href="#">
              <span class="menu-icon">🔥</span>
              <span class="menu-label">ROZPALANIE</span>
            </a>

            <a class="menu-btn" data-view="work" style="display: none" href="#">
              <span class="menu-icon">🔥</span>
              <span class="menu-label">PRACA</span>
            </a>

            <a class="menu-btn" data-view="add-fuel" href="add-fuel.html" style="display: none;">
              <span class="menu-icon">➕</span>
              <span class="menu-label">DOŁÓŻ OPAŁ</span>
            </a>

            <a class="menu-btn active" data-view="settings" href="settings.html">
              <span class="menu-icon">⚙️</span>
              <span class="menu-label">USTAWIENIA</span>
            </a>

            <a class="menu-btn" data-view="stats" href="stats.html">
              <span class="menu-icon">📊</span>
              <span class="menu-label">STATYSTYKI</span>
            </a>

            <a class="menu-btn" data-view="service" href="service.html">
              <span class="menu-icon">🔧</span>
              <span class="menu-label">SERWIS</span>
            </a>
            
            <a class="menu-btn" data-view="logs" href="logs.html">
              <span class="menu-icon">🧾</span>
              <span class="menu-label">LOGI</span>
            </a>
			
		    <a class="menu-btn danger" data-view="emergency" href="#">
			  <span class="menu-icon">⚠️</span>
              <span class="menu-label">STOP</span>
            </a>
          </div>
        </aside>
      </main>

      <footer class="status-bar">
        <span id="status-text"></span>
      </footer>
    </div>
    <label for="nav-toggle" class="menu-overlay" aria-label="Zamknij menu"></label>
    <script src="js/side-clock.js"></script>
    <script src="js/furnace-ui-utils.js"></script>
    <script src="js/settings-config.js"></script>
	<script src="js/mode-control.js"></script>
  </body>
</html>
