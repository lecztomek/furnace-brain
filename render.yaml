# Cloud test environment (Render.com, free plan).
# The furnace is simulated (MockHardware) - nothing here drives real hardware.
# Every push to main that passes the GitHub tests is deployed here automatically.
services:
  - type: web
    name: furnace-brain-test
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/state/current
    envVars:
      - key: FURNACE_BRAIN_HW_RPI
        value: "0"
      - key: FURNACE_BRAIN_SERVE_FRONTEND
        value: frontend
      - key: FURNACE_BRAIN_DATA_ROOT
        value: /tmp/furnace-brain
      # simulated time runs N times faster than real time
      - key: FURNACE_BRAIN_TIME_SCALE
        value: "10"
