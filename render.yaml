# Cloud test environment (Render.com, free plan).
# The furnace is simulated (MockHardware) - nothing here drives real hardware.
# Every push to main that passes the GitHub tests is deployed here automatically.
services:
  # remote read-only view of the real furnace (backend/viewer.py); follows the
  # prod branch, so its GUI matches the version running on the Pi. The Pi's
  # "Podgląd zdalny" module pushes the data here.
  - type: web
    name: furnace-brain-view
    runtime: python
    plan: free
    branch: prod
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.viewer:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/viewer/health
    envVars:
      # copy this value to FURNACE_BRAIN_VIEWER_TOKEN in /etc/furnace-brain.env on the Pi
      - key: FURNACE_BRAIN_VIEWER_TOKEN
        generateValue: true
      # optional password for viewing (user "podglad"); set it in the dashboard
      - key: FURNACE_BRAIN_VIEWER_PASSWORD
        sync: false

  - type: web
    name: furnace-brain-test
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    # start from the real settings in values.yaml.sample (GUI changes are lost
    # on every redeploy/sleep - the free plan has no persistent disk)
    buildCommand: >-
      pip install -r requirements.txt &&
      for f in backend/modules/*/values.yaml.sample; do [ -e "${f%.sample}" ] || cp "$f" "${f%.sample}"; done
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/state/current
    envVars:
      - key: FURNACE_BRAIN_HW_RPI
        value: "0"
      - key: FURNACE_BRAIN_SERVE_FRONTEND
        value: frontend
      - key: FURNACE_BRAIN_DATA_ROOT
        value: /tmp/furnace-brain
      # past days of demo data for the statistics page (simulator only)
      - key: FURNACE_BRAIN_DEMO_DAYS
        value: "30"
      # simulated time runs N times faster than real time
      - key: FURNACE_BRAIN_TIME_SCALE
        value: "10"
