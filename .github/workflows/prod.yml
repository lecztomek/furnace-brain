name: Deploy to prod

# Moves the prod branch to the chosen version - the furnace (furnace-update.timer
# on the Pi) picks it up within a few minutes. Every deploy gets a
# prod-YYYYMMDD-HHMMSS tag, so going back to an older version = run this
# workflow with one of those tags.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version: main, a prod-... tag (to go back) or a commit hash"
        required: true
        default: main
      skip_tests:
        description: "Skip tests (emergencies only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve commit
        id: v
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sha=$(git rev-parse --verify --quiet "origin/$VERSION^{commit}" \
             || git rev-parse --verify --quiet "$VERSION^{commit}") \
             || { echo "::error::Unknown version '$VERSION'"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying: $(git log -1 --format='%h %s (%ci)' "$sha")"
          git checkout --quiet "$sha"

      - uses: actions/setup-python@v5
        if: ${{ !inputs.skip_tests }}
        with:
          python-version: "3.11"

      - name: Tests
        if: ${{ !inputs.skip_tests }}
        run: |
          pip install -r requirements.txt pytest pytest-timeout
          # exit code 5 = no tests collected (older versions) - not a blocker
          python -m pytest -q --timeout=120 \
            --ignore=tests/test_mixer_module.py \
            --ignore=tests/test_stats_module.py || [ $? -eq 5 ]

      - name: Move prod
        env:
          SHA: ${{ steps.v.outputs.sha }}
        run: |
          tag="prod-$(TZ=Europe/Warsaw date +%Y%m%d-%H%M%S)"
          git push --force origin "$SHA:refs/heads/prod"
          git tag "$tag" "$SHA"
          git push origin "$tag"
          {
            echo "## prod → \`$tag\`"
            echo "$(git log -1 --format='`%h` %s' "$SHA")"
            echo
            echo "The furnace will pick up this version within ~5 minutes."
            echo
            echo "### Recent deploys (enter a tag as the version to go back)"
            git fetch --quiet --tags origin
            git for-each-ref --sort=-refname --count=10 \
              --format='- `%(refname:short)` — %(subject)' 'refs/tags/prod-*'
          } >> "$GITHUB_STEP_SUMMARY"
