name: Deploy to prod

# Moves the prod branch to the chosen version - the furnace (furnace-update.timer
# on the Pi) picks it up within a few minutes. The deployed commit is tagged
# v<VERSION> (from the VERSION file), so going back to an older version = run
# this workflow with one of those tags, e.g. v1.0.0.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version: main, a tag like v1.0.0 (to go back) or a commit hash"
        required: true
        default: main
      skip_tests:
        description: "Skip tests (emergencies only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve commit
        id: v
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sha=$(git rev-parse --verify --quiet "origin/$VERSION^{commit}" \
             || git rev-parse --verify --quiet "$VERSION^{commit}") \
             || { echo "::error::Unknown version '$VERSION'"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying: $(git log -1 --format='%h %s (%ci)' "$sha")"
          git checkout --quiet "$sha"

      - uses: actions/setup-python@v5
        if: ${{ !inputs.skip_tests }}
        with:
          python-version: "3.11"

      - name: Tests
        if: ${{ !inputs.skip_tests }}
        run: |
          pip install -r requirements.txt pytest pytest-timeout httpx
          # exit code 5 = no tests collected (older versions) - not a blocker
          python -m pytest -q --timeout=120 \
            --ignore=tests/test_mixer_module.py \
            --ignore=tests/test_stats_module.py || [ $? -eq 5 ]

      - name: Check version tag
        id: tag
        env:
          SHA: ${{ steps.v.outputs.sha }}
        run: |
          version=$(git show "$SHA:VERSION" 2>/dev/null | tr -d '[:space:]')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::VERSION at this commit is missing or not X.Y.Z ('$version')"; exit 1; }
          tag="v$version"
          existing=$(git rev-parse --verify --quiet "refs/tags/$tag^{commit}" || true)
          if [[ -n "$existing" && "$existing" != "$SHA" ]]; then
            echo "::error::$tag already points to $(git log -1 --format='%h %s' "$existing") - bump VERSION for new changes"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "new=$([[ -z "$existing" ]] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Move prod
        env:
          SHA: ${{ steps.v.outputs.sha }}
          TAG: ${{ steps.tag.outputs.tag }}
          NEW_TAG: ${{ steps.tag.outputs.new }}
        run: |
          git push --force origin "$SHA:refs/heads/prod"
          if [[ "$NEW_TAG" == 1 ]]; then
            git tag "$TAG" "$SHA"
            git push origin "$TAG"
          fi
          {
            echo "## prod → \`$TAG\`"
            echo "$(git log -1 --format='`%h` %s' "$SHA")"
            echo
            echo "The furnace will pick up this version within ~5 minutes."
            echo
            echo "### Released versions (enter one as the version to go back)"
            git fetch --quiet --tags origin
            git for-each-ref --sort=-v:refname --count=10 \
              --format='- `%(refname:short)` — %(subject)' 'refs/tags/v*'
          } >> "$GITHUB_STEP_SUMMARY"
