name: Remote view (GitHub Pages)

# Publishes the GUI of the version running on the furnace (prod branch) as the
# remote read-only view. Data comes from Firebase (Pi module "Podgląd zdalny"),
# viewer/viewer-shim.js answers the GUI's /api requests and ignores changes.
# Runs after every "Deploy to prod" and on demand.
# Setup: Settings -> Pages -> Source: GitHub Actions;
#        Settings -> Secrets and variables -> Actions -> Variables:
#        VIEWER_FIREBASE_URL = https://<project>-default-rtdb.<region>.firebasedatabase.app

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: prod

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: pages

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # viewer files from this workflow's commit, GUI from the furnace's version
      - uses: actions/checkout@v4
        with:
          path: tools
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'prod' }}
          path: src

      - name: Build site
        id: build
        env:
          # a repository variable (or, if added there by mistake, a secret)
          DB_VAR: ${{ vars.VIEWER_FIREBASE_URL }}
          DB_SECRET: ${{ secrets.VIEWER_FIREBASE_URL }}
        run: |
          DB="${DB_VAR:-$DB_SECRET}"
          DB="$(printf '%s' "$DB" | tr -d '[:space:]"'"'"'')"   # spaces, newlines, quotes
          DB="${DB%/}"
          if [[ "$DB" != https://* ]]; then
            # not set up yet - don't fail "Deploy to prod" because of it
            if [[ -z "$DB_VAR$DB_SECRET" ]]; then
              seen="nothing (no variable or secret named VIEWER_FIREBASE_URL)"
            else
              seen="'${DB:0:12}...' (${#DB} characters) - must start with https://"
            fi
            echo "::warning::Remote view skipped: VIEWER_FIREBASE_URL - got $seen"
            exit 0
          fi
          cp -r src/frontend site
          cp tools/viewer/viewer-shim.js site/js/
          printf 'window.FURNACE_VIEWER_DB = %s;\n' "$(jq -Rn --arg v "$DB" '$v')" > site/js/viewer-config.js
          # Pages caches every file for 10 min on its own: a new page with an old script
          # breaks. The version in the URLs makes each deploy load its own files.
          VER="$(tr -d '[:space:]' < src/VERSION 2>/dev/null || date +%s)"
          sed -i -E "s#(src=\"js/[^\"?]+\.js)\"#\1?v=$VER\"#g; s#(href=\"[^\"?:]+\.css)\"#\1?v=$VER\"#g" site/*.html
          # both scripts go before everything else in <head>
          for f in site/*.html; do
            sed -i '0,/<head>/s//<head>\n    <script src="js\/viewer-config.js"><\/script>\n    <script src="js\/viewer-shim.js"><\/script>/' "$f"
            grep -q viewer-shim.js "$f" || { echo "::error::no <head> in $f"; exit 1; }
          done
          echo "Version: $(cat src/VERSION 2>/dev/null)" >> "$GITHUB_STEP_SUMMARY"
          echo "ready=1" >> "$GITHUB_OUTPUT"

      - if: steps.build.outputs.ready
        uses: actions/configure-pages@v5
      - if: steps.build.outputs.ready
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.build.outputs.ready
        id: deploy
        uses: actions/deploy-pages@v4
