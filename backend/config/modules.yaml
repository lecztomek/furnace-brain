modules:
  - id: mode
    path: backend.modules.mode:ModeModule
    enabled: true
    critical: true
    about: "Tryb kotła: przełącza ROZPALANIE na PRACĘ, gdy kocioł jest dość gorący i rozpalanie trwało wystarczająco długo."

  - id: flameout
    path: backend.modules.flameout:FlameoutModule
    enabled: true
    critical: true
    about: "Wykrywa wygaśnięcie ognia w PRACY (brak przyrostu ciepła mimo podawania) i zatrzymuje kocioł (STOP)."

  - id: power_ignition
    path: backend.modules.power_ignition:IgnitionPowerModule
    enabled: true
    critical: true
    about: "Moc % w ROZPALANIU: doprowadza kocioł do temperatury rozpalania."

  # how low the PID may go: a curve of the outside temperature, set by hand (the fuel bed must not burn thin)
  - id: power_floor
    path: backend.modules.power_floor:PowerFloorModule
    enabled: true
    critical: true
    about: "Krzywa minimum mocy: jak nisko PID może zejść w pracy, z temperatury na dworze (ustawiane jak krzywa grzejników), żeby żar się nie wypalił; puszcza, gdy kocioł wyraźnie za ciepły."

  - id: power_work
    path: backend.modules.power_work:WorkPowerModule
    enabled: true
    critical: true
    about: "Moc % w PRACY: PID do zadanej kotła (opcjonalne wyprzedzanie spalinami), stan zachowany po restarcie."

  - id: blower
    path: backend.modules.blower:BlowerModule
    enabled: true
    critical: true
    about: "Obroty dmuchawy (PWM) z mocy %, w jej cyklu pracy i przerwy."

  - id: feeder
    path: backend.modules.feeder:FeederModule
    enabled: true
    critical: true
    about: "Ślimak: impulsy podawania i przerwy wyliczane z mocy %."

  - id: curve
    path: backend.modules.curve:CurveModule
    enabled: true
    critical: true
    about: "Zadana grzejników: krzywa grzewcza z uśrednionej temperatury zewnętrznej albo stała zadana."

  - id: mixer
    path: backend.modules.mixer:MixerModule
    enabled: true
    critical: true
    about: "Zawór mieszający: impulsy otwierania/zamykania, by woda na grzejniki miała zadaną; zamyka, gdy kocioł za zimny."

  - id: pump_cwu
    path: backend.modules.pump_cwu:CwuPumpModule
    enabled: true
    critical: true
    about: "Pompa ciepłej wody (CWU): włącza się powyżej swojej temperatury kotła, z histerezą."

  - id: pump_co
    path: backend.modules.pump_co:CoPumpModule
    enabled: true
    critical: true
    about: "Pompa centralnego ogrzewania (CO): włącza się powyżej swojej temperatury kotła, z histerezą (albo wymuszona wł./wył.)."

  - id: stats
    path: backend.modules.stats:StatsModule
    enabled: true
    critical: true
    about: "Liczenie węgla i ciepła z czasu pracy ślimaka: pliki 5-minutowe i dobowe, bieżące kW i kg/h."

  - id: manual
    path: backend.modules.manual:ManualModule
    enabled: true
    critical: true
    about: "Tryb RĘCZNY: ustawia wyjścia wybrane ręcznie na stronie sterowania ręcznego."

  - id: overheat
    path: backend.modules.overheat:OverheatModule
    enabled: true
    critical: true
    about: "Ochrona przed przegrzaniem: kocioł za gorący (stop podawania i powietrza, pompy wł., zawór otwarty); podajnik za gorący (wypchnięcie żaru)."

  - id: safety
    path: backend.modules.safety:SafetyModule
    enabled: true
    critical: true
    about: "Brak odczytów czujników: bez temperatury kotła podawanie staje, a pompy pracują; dla pozostałych zdarzenia."

  - id: weather
    path: backend.modules.weather:WeatherModule
    enabled: true
    critical: false
    about: "Temperatura zewnętrzna i prognoza z internetu (Open-Meteo), udostępniane innym modułom."

  - id: remote_view
    path: backend.modules.remote_view:RemoteViewModule
    enabled: true
    critical: false
    about: "Wysyła stan, historię, logi i raporty do Firebase dla podglądu zdalnego (tylko odczyt)."

  - id: history
    path: backend.modules.history:HistoryModule
    enabled: true
    critical: false
    about: "Historia: wiersz CSV co 30 s (temperatury, moc, tryb), plik na każdą godzinę na pendrive."

  - id: eventlog
    path: backend.modules.eventlog:EventLogModule
    enabled: true
    critical: false
    about: "Dziennik zdarzeń: każde zdarzenie każdego modułu do plików CSV na pendrive."

  # settings only (Ustawienia -> Sprzęt): GPIO of each output, DS18B20 of each sensor
  - id: hardware
    path: backend.modules.hardware:HardwareModule
    enabled: true
    critical: false
    about: "Podłączenia: który GPIO steruje którym wyjściem i który DS18B20 jest którym czujnikiem."

  # how the furnace was set up: every setting with the version, on the USB stick
  - id: settings_log
    path: backend.modules.settings_log:SettingsLogModule
    enabled: true
    critical: false
    about: "Historia ustawień: wszystkie ustawienia z wersją programu na pendrive - przy starcie, po zmianie i codziennie."

  # how fast the boiler goes up or down - the main page shows it under the boiler temperature
  - id: trend
    path: backend.modules.trend:TrendModule
    enabled: true
    critical: false
    about: "Trend: o ile °C na 10 min rośnie albo spada temperatura kotła (strona główna, pod temperaturą kotła)."

  # chosen events to the phone through ntfy (at first only the flame-out)
  - id: notify
    path: backend.modules.notify:NotifyModule
    enabled: true
    critical: false
    about: "Powiadomienia na telefon (ntfy): wybrane zdarzenia - na razie wygaśnięcie pieca; wysyłane w tle, nic nie steruje."
