id: curve
name: Krzywa grzewcza
description: 'Zadana temperatura grzejników: z krzywej (średnia temperatura na dworze z kilku godzin) albo stała, gdy krzywa wyłączona. Zawór mieszający dochodzi do tej zadanej.'
groups:
- id: basic
  label: Zadana stała
- id: curve
  label: Krzywa grzewcza
- id: sun
  label: Słońce
fields:
- key: target_temp
  label: Docelowa temperatura za zaworem
  type: number
  unit: °C
  min: 20
  max: 70
  step: 0.5
  default: 40
  group: basic
  description: Temperatura, do której dążymy za zaworem mieszającym (obieg grzejnikowy/podłoga).
- key: curve_enabled
  label: Krzywa grzewcza
  type: bool
  label_on: WŁĄCZONA
  label_off: WYŁĄCZONA
  default: false
  group: curve
  description: 'Zadana za zaworem liczona z temperatury na dworze (uśrednionej z kilku godzin) zamiast stałej "Docelowej temperatury". Bez temperatury zewnętrznej przez godzinę wraca do stałej zadanej.

    '
- key: curve_at_0
  label: Zadana przy 0°C na dworze
  type: number
  unit: °C
  min: 20
  max: 60
  step: 0.5
  default: 30
  group: curve
  description: Temperatura za zaworem, gdy na dworze jest 0°C. Przesuwa całą krzywą w górę/dół (cieplej/chłodniej w domu).
- key: curve_slope
  label: Nachylenie krzywej
  type: number
  unit: °C/°C
  min: 0.1
  max: 2
  step: 0.05
  default: 0.45
  group: curve
  description: O ile stopni podnieść zadaną na każdy stopień mrozu (i obniżyć na każdy stopień ciepła).
- key: curve_min
  label: Minimalna zadana z krzywej
  type: number
  unit: °C
  min: 20
  max: 60
  step: 0.5
  default: 22
  group: curve
- key: curve_max
  label: Maksymalna zadana z krzywej
  type: number
  unit: °C
  min: 20
  max: 70
  step: 0.5
  default: 45
  group: curve
- key: curve_avg_h
  label: Uśrednianie temp. zewnętrznej
  type: number
  unit: h
  min: 0.5
  max: 24
  step: 0.5
  default: 12
  group: curve
  description: Z ilu ostatnich godzin liczona jest średnia temperatura na dworze. Dom i woda w instalacji reagują wolno, więc krótkie wahania (noc/dzień) są wygładzane.
- key: sun_enabled
  label: Słoneczny dzień
  type: bool
  label_on: WŁĄCZONE
  label_off: WYŁĄCZONE
  default: true
  group: sun
  description: Gdy prognoza pogody daje na dziś dość słońca, cały dzień grzejniki chłodniej - słońce dogrzewa pokoje przez okna. Tylko przy włączonej krzywej.
- key: sun_drop
  label: Słoneczny dzień - chłodniej o
  type: number
  unit: °C
  min: 0
  max: 5
  step: 0.5
  default: 1
  group: sun
  description: O ile chłodniej grzejniki przez cały słoneczny dzień.
- key: sun_hours
  label: Słoneczny dzień - od godzin słońca
  type: number
  unit: h
  min: 1
  max: 10
  step: 0.5
  default: 4
  group: sun
  description: Ile godzin słońca w prognozie na dziś robi dzień słonecznym (zimą przy czystym niebie to ok. 6-8 h, w pochmurny dzień 0-2 h).
