id: flameout
name: "Wygaszanie"
description: >
  Gdy piec wygaśnie w trybie PRACA, zatrzymuje ślimak i dmuchawę (tryb STOP) i zgłasza alarm,
  zamiast podawać węgiel do zimnej retorty. Rozpalanie nie jest pilnowane.

groups:
  - id: basic
    label: "Podstawowe"
  - id: early
    label: "Wcześniejsze zatrzymanie"

fields:
  - key: enabled
    label: "Wykrywanie wygaśnięcia"
    type: bool
    label_on: "WŁĄCZONE"
    label_off: "WYŁĄCZONE"
    default: true
    group: basic

  - key: boiler_below_temp
    label: "Kocioł poniżej"
    type: number
    unit: "°C"
    min: 25
    max: 50
    step: 1
    default: 40
    group: basic
    description: "Uznajemy, że piec wygasł, gdy kocioł jest poniżej tej temperatury (i spełnione są pozostałe warunki)."

  - key: power_min_percent
    label: "Mimo mocy co najmniej"
    type: number
    unit: "%"
    min: 50
    max: 100
    step: 1
    default: 85
    group: basic
    description: "Średnia moc w tym czasie - sterownik próbował grzać, a temperatura nie rosła."

  - key: window_min
    label: "Przez"
    type: number
    unit: "min"
    min: 10
    max: 120
    step: 5
    default: 30
    group: basic

  - key: rise_max_degC
    label: "Wzrost kotła w tym czasie najwyżej"
    type: number
    unit: "°C"
    min: 0
    max: 5
    step: 0.1
    default: 0.5
    group: basic
    description: "Jeśli kocioł w tym czasie urósł więcej, ogień się podnosi - nie zatrzymujemy."

  - key: flue_rise_max_degC
    label: "Wzrost spalin w tym czasie najwyżej"
    type: number
    unit: "°C"
    min: 0
    max: 20
    step: 0.5
    default: 1
    group: basic
    description: "Jeśli spaliny w tym czasie urosły więcej, coś się pali - nie zatrzymujemy. Bez odczytu spalin warunek jest pomijany."

  - key: early_enabled
    label: "Wcześniejsze zatrzymanie"
    type: bool
    label_on: "WŁĄCZONE"
    label_off: "WYŁĄCZONE"
    default: true
    group: early
    description: "Nie czeka, aż kocioł spadnie poniżej progu (to trwa 1-2 h, a ślimak cały czas pcha węgiel do zgasłego paleniska): przy pełnej mocy spaliny dalej spadają - do paleniska nic nie dochodzi (węgiel zawieszony albo się skończył). 29.10 zatrzymałoby ok. 05:22 zamiast 07:13."

  - key: early_power_percent
    label: "Gdy moc co najmniej"
    type: number
    unit: "%"
    min: 50
    max: 100
    step: 1
    default: 85
    group: early

  - key: early_after_min
    label: "...od"
    type: number
    unit: "min"
    min: 2
    max: 30
    step: 1
    default: 5
    group: early
    description: "Po dołku przy pełnej mocy ogień wraca - spaliny zaczynają rosnąć po kilku minutach."

  - key: early_flue_below
    label: "...spaliny poniżej"
    type: number
    unit: "°C"
    min: 30
    max: 100
    step: 1
    default: 55
    group: early
    description: "Przy wyższych spalinach ogień jeszcze się pali - zwykłe wahania nic nie robią."

  - key: early_flue_drop
    label: "...i spadają co najmniej"
    type: number
    unit: "°C/min"
    min: 0.1
    max: 2
    step: 0.1
    default: 0.3
    group: early
    description: "Liczone z ostatnich 5 minut."

  - key: early_hold_min
    label: "Zatrzymaj, gdy to trwa"
    type: number
    unit: "min"
    min: 3
    max: 60
    step: 1
    default: 10
    group: early
    description: "Przez ten czas spaliny nie mogą wzrosnąć o 3°C od najniższego punktu, a kocioł nie może rosnąć - inaczej ogień wrócił (albo czujnik spalin kłamie) i nic się nie dzieje."
