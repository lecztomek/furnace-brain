id: hardware
name: Sprzęt
description: Fizyczne wyjścia i czujniki - każdemu przypisujesz funkcję. Ta sama funkcja na dwóch wyjściach, funkcja bez wyjścia albo jeden czujnik w dwóch miejscach - zapis zostanie odrzucony.
groups:
- id: outputs
  label: Wyjścia
- id: sensors
  label: Czujniki
fields:
- key: gpio16
  label: Wyjście GPIO16 (nóżka 36)
  type: text
  options: &id001
  - ślimak
  - pompa CWU
  - pompa CO
  - zawór - otwórz
  - zawór - zamknij
  - nieużywane
  default: ślimak
  group: outputs
  description: 'Co jest podłączone do przekaźnika na GPIO16 (nóżka 36 złącza Pi). Fabrycznie: ślimak. Każda funkcja musi być dokładnie na jednym wyjściu - np. zamiana pomp: tu pompa CO, na drugim wyjściu pompa CWU, i jeden zapis. Zmiana działa od razu: wszystkie wyjścia na moment się wyłączają i wracają z nowym przypisaniem.'
- key: gpio20
  label: Wyjście GPIO20 (nóżka 38)
  type: text
  options: *id001
  default: pompa CWU
  group: outputs
  description: 'Co jest podłączone do przekaźnika na GPIO20 (nóżka 38 złącza Pi). Fabrycznie: pompa CWU. Każda funkcja musi być dokładnie na jednym wyjściu - np. zamiana pomp: tu pompa CO, na drugim wyjściu pompa CWU, i jeden zapis. Zmiana działa od razu: wszystkie wyjścia na moment się wyłączają i wracają z nowym przypisaniem.'
