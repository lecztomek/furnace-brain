id: hardware
name: Sprzęt
description: Które wyjście (GPIO) steruje którym urządzeniem i który czujnik DS18B20 jest którym. Dwa urządzenia na jednym GPIO albo jeden czujnik w dwóch miejscach - zapis zostanie odrzucony.
groups:
- id: outputs
  label: Wyjścia (GPIO)
- id: sensors
  label: Czujniki
fields:
- key: pin_feeder
  label: Ślimak (podajnik)
  type: number
  unit: GPIO
  min: 2
  max: 27
  step: 1
  default: 16
  group: outputs
  description: 'Numer GPIO (BCM), nie numer nóżki. Fabrycznie GPIO16 (nóżka 36). Zmiana działa od razu: wszystkie wyjścia na moment się wyłączają i wracają na nowych pinach.'
- key: pin_pump_cwu
  label: Pompa CWU
  type: number
  unit: GPIO
  min: 2
  max: 27
  step: 1
  default: 20
  group: outputs
  description: 'Numer GPIO (BCM), nie numer nóżki. Fabrycznie GPIO20 (nóżka 38). Zmiana działa od razu: wszystkie wyjścia na moment się wyłączają i wracają na nowych pinach.'
- key: pin_pump_co
  label: Pompa CO
  type: number
  unit: GPIO
  min: 2
  max: 27
  step: 1
  default: 21
  group: outputs
  description: 'Numer GPIO (BCM), nie numer nóżki. Fabrycznie GPIO21 (nóżka 40). Zmiana działa od razu: wszystkie wyjścia na moment się wyłączają i wracają na nowych pinach.'
- key: pin_mixer_open
  label: Zawór mieszający - otwórz
  type: number
  unit: GPIO
  min: 2
  max: 27
  step: 1
  default: 6
  group: outputs
  description: 'Numer GPIO (BCM), nie numer nóżki. Fabrycznie GPIO6 (nóżka 31). Zmiana działa od razu: wszystkie wyjścia na moment się wyłączają i wracają na nowych pinach.'
- key: pin_mixer_close
  label: Zawór mieszający - zamknij
  type: number
  unit: GPIO
  min: 2
  max: 27
  step: 1
  default: 12
  group: outputs
  description: 'Numer GPIO (BCM), nie numer nóżki. Fabrycznie GPIO12 (nóżka 32). Zmiana działa od razu: wszystkie wyjścia na moment się wyłączają i wracają na nowych pinach.'
- key: fan_inverted
  label: Dmuchawa - odwrócone PWM
  type: bool
  label_on: TAK
  label_off: NIE
  default: false
  group: outputs
  description: 'Dmuchawa nie jest na przekaźniku: obroty ustawia sygnał PWM z GPIO19 (nóżka 35) do modułu YYAC-3S - ten pin jest stały. TAK, gdy moduł kręci odwrotnie (0% = pełne obroty). Zmiana po restarcie.'
- key: sensor_boiler
  label: Czujnik kotła
  type: text
  default: 28-000000506777
  group: sensors
  description: 'Numer czujnika DS18B20 (np. 28-000000506777), puste = brak. Wykryte czujniki z temperaturą i przypisaniem: Serwis → Diagnostyka Pi → Czujniki 1-Wire. Zmiana działa od razu.'
