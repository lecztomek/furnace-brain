  description: 'Co jest podłączone do przekaźnika na GPIO6 (nóżka 31 złącza Pi). Fabrycznie: zawór - otwórz. Każda funkcja musi być dokładnie na jednym wyjściu - np. zamiana pomp: tu pompa CO, na drugim wyjściu pompa CWU, i jeden zapis. Zmiana działa od razu: wszystkie wyjścia na moment się wyłączają i wracają z nowym przypisaniem.'
