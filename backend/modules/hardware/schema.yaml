- key: fan_inverted
  label: Dmuchawa - odwrócone PWM
  type: bool
  label_on: TAK
  label_off: NIE
  default: false
  group: outputs
  description: 'Dmuchawa nie jest na przekaźniku: obroty ustawia sygnał PWM z GPIO19 (nóżka 35) do modułu YYAC-3S - ten pin jest stały. TAK, gdy moduł kręci odwrotnie (0% = pełne obroty). Zmiana po restarcie.'
- key: sensor1
  label: Czujnik 1 - który
  type: text
  options_from: w1
  default: 28-000000506777
  group: sensors
  description: Czujnik DS18B20 z listy wykrytych na przewodzie (numer i obecna temperatura - złap czujnik ręką i zobacz, któremu rośnie). Puste = miejsce wolne. Zmiana działa od razu.
- key: sensor1_role
  label: Czujnik 1 - funkcja
  type: text
  options: &id002
  - kocioł
  - podajnik
  - grzejniki
  - zasobnik CWU
  - powrót
  - za zaworem
  - nieużywany
  default: kocioł
  group: sensors
  description: Co mierzy ten czujnik. Każda funkcja najwyżej raz, czujnik kotła obowiązkowy.
