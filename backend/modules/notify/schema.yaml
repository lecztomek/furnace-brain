id: notify
name: Powiadomienia na telefon
description: 'Wybrane zdarzenia pieca na telefon przez ntfy: zainstaluj aplikację ntfy, dodaj subskrypcję i wpisz w niej temat pokazany niżej (serwer ntfy.sh). Temat wylicza się przy pierwszym starcie z klucza podglądu zdalnego (tylko na Pi) - działa jak hasło, kto go zna, widzi powiadomienia. Wysyłane w tle, z kilkoma próbami, gdy nie ma internetu; sterowanie nigdy na to nie czeka. Gdy padnie samo Pi albo prąd, nic nie przyjdzie.'
groups:
- id: basic
  label: Podstawowe
- id: what
  label: Co wysyłać
fields:
- key: enabled
  label: Powiadomienia
  type: bool
  label_on: WŁĄCZONE
  label_off: WYŁĄCZONE
  default: true
  group: basic
- key: topic
  label: Temat (wpisz w aplikacji ntfy)
  type: text
  default: ''
  group: basic
  description: Wyliczony przy pierwszym starcie z klucza podglądu zdalnego. Żeby zmienić, trzeba wyczyścić go w pliku notify/values.yaml na Pi - wygeneruje się nowy.
- key: server
  label: Serwer
  type: text
  default: https://ntfy.sh
  group: basic
- key: send_test
  label: Wyślij powiadomienie testowe
  type: bool
  label_on: WYŚLIJ
  label_off: NIE
  default: false
  group: basic
  description: Włącz i zapisz - przyjdzie jedno powiadomienie testowe, a przełącznik sam wróci na „NIE”.
- key: flameout
  label: Piec wygasł (STOP)
  type: text
  options: [nie, cicho, zwykle, głośno, alarm]
  default: alarm
  group: what
  description: 'nie - nie wysyłaj; cicho - bez dźwięku, tylko na liście w aplikacji; zwykle - zwykły dźwięk; głośno - wyraźniejszy dźwięk; alarm - najmocniej, długo, także w nocy.'
- key: fading
  label: Ogień słabnie mimo pełnej mocy
  type: text
  options: [nie, cicho, zwykle, głośno, alarm]
  default: nie
  group: what
  description: Ok. 10 min przed zatrzymaniem - czas, żeby sprawdzić zasyp.
- key: overheat
  label: Przegrzanie kotła albo podajnika
  type: text
  options: [nie, cicho, zwykle, głośno, alarm]
  default: nie
  group: what
- key: sensor
  label: Brak odczytu czujnika
  type: text
  options: [nie, cicho, zwykle, głośno, alarm]
  default: nie
  group: what
- key: module_error
  label: Błąd modułu
  type: text
  options: [nie, cicho, zwykle, głośno, alarm]
  default: nie
  group: what
  description: Ten sam rodzaj najwyżej raz na 5 min.
