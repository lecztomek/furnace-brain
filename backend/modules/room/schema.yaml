id: room
name: "Temperatura w domu"
description: "Termometr w domu przez WiFi (Tasmota z DS18B20). Tylko zapis w historii i podgląd - sterowanie pieca i krzywa go nie używają."

groups:
  - id: basic
    label: "Termometr"

fields:
  - key: enabled
    label: "Odczyt termometru"
    type: bool
    default: true
    label_on: "WŁĄCZONY"
    label_off: "WYŁĄCZONY"
    group: basic

  - key: address
    label: "Adres termometru"
    type: text
    default: ""
    group: basic
    description: "Adres w sieci domowej, np. 192.168.1.50 (Tasmota). Puste = nie ma termometru."

  - key: refresh_s
    label: "Odczyt co"
    type: number
    unit: "s"
    min: 30
    max: 600
    step: 30
    default: 60
    group: basic

  - key: max_age_min
    label: "Maksymalny wiek odczytu"
    type: number
    unit: "min"
    min: 2
    max: 60
    step: 1
    default: 10
    group: basic
    description: "Starszy odczyt nie jest zapisywany (np. termometr bez prądu albo poza WiFi)."
