id: network
name: "Sieć"
description: "Sprawdza, czy sterownik ma połączenie z routerem (WiFi) i z internetem. Gdy go nie ma dłużej niż kilka minut, na ekranie głównym jest ostrzeżenie. Piec działa bez sieci - nie ma wtedy pogody, podglądu zdalnego i aktualizacji."

groups:
  - id: basic
    label: "Sieć"

fields:
  - key: enabled
    label: "Sprawdzanie sieci"
    type: bool
    default: true
    label_on: "WŁĄCZONE"
    label_off: "WYŁĄCZONE"
    group: basic

  - key: check_s
    label: "Sprawdzanie co"
    type: number
    unit: "s"
    min: 15
    max: 300
    step: 15
    default: 30
    group: basic

  - key: alarm_after_min
    label: "Ostrzeżenie po"
    type: number
    unit: "min"
    min: 1
    max: 30
    step: 1
    default: 3
    group: basic
    description: "Krótsze przerwy (np. nocne) nie pokazują się na ekranie - są tylko w logach."
