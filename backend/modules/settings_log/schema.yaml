id: settings_log
name: "Historia ustawień"
description: "Zapisuje na pendrive wszystkie ustawienia z wersją programu: przy starcie (każda aktualizacja), po każdej zmianie i raz dziennie. Dzięki temu wiadomo, jak piec był ustawiony w każdym dniu historii."

groups:
  - id: basic
    label: "Podstawowe"

fields:
  - key: enabled
    label: "Zapisywanie historii ustawień"
    type: bool
    label_on: "WŁĄCZONE"
    label_off: "WYŁĄCZONE"
    default: true
    group: basic
    description: "Kilka linijek dziennie w modules/settings_log/data/settings_RRRRMM.jsonl na pendrive. Strojenie porównuje z tego pracę przed i po zmianach (także zmianach wersji)."

  - key: check_every_s
    label: "Sprawdzanie zmian co"
    type: number
    unit: "s"
    min: 2
    max: 300
    step: 1
    default: 10
    group: basic
    description: "Co ile sekund moduł sprawdza, czy któryś plik ustawień się zmienił (z GUI albo ręcznie). Samo sprawdzenie to tylko daty plików - nic nie czyta."
