id: eventlog
name: "Logi zdarzeń"
description: "Zapis eventów (SystemState.recent_events) do plików CSV."

groups:
  - id: basic
    label: "Podstawowe"

fields:
  - key: log_dir
    label: "Katalog na logi"
    type: text
    default: "data"
    group: basic
    description: >
      Katalog, w którym będą zapisywane pliki CSV.
      Ścieżka względna liczona względem katalogu modułu.

  - key: file_prefix
    label: "Prefiks plików"
    type: text
    default: "events"
    group: basic
    description: >
      Prefiks nazwy pliku CSV, np. events_YYYYMMDD_HH.csv

  - key: rotate
    label: "Rotacja plików"
    type: text
    options: ["hour", "day"]
    default: "hour"
    group: basic
    description: >
      hour = jeden plik na godzinę, day = jeden plik na dzień.

  - key: compact
    label: "Skrócone logi"
    type: bool
    default: true
    label_on: "WŁĄCZONE"
    label_off: "WYŁĄCZONE"
    group: basic
    description: >
      Zawór mieszający: jeden wpis na ruch. Dmuchawa i ślimak: podsumowanie co
      15 minut zamiast wpisu przy każdej zmianie. Wyłącz, żeby zapisywać wszystko
      (np. do diagnozowania). Sterowanie działa tak samo w obu przypadkach.
